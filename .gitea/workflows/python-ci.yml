name: Python CI

on:
  pull_request:
    paths:
      - '*.py'
      - 'tests/**'
      - 'web/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.gitea/workflows/python-ci.yml'
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'web/**'
      - 'tools/**'
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'pyproject.toml'
      - 'LICENSE'
      - '.gitea/workflows/python-ci.yml'

jobs:
  test:
    runs-on: python-3.11
    steps:
      - uses: builtin:checkout
      - run: python -m pip install '.[web]'
      - run: python -m compileall -q . web/
      - run: PYTHONPATH=. python -m unittest discover -s tests -t .
      - run: tools/smoke
