[package]
name = "lmloop"
version = "0.1.0"
edition = "2024"
description = "lmloop Rust rewrite, milestone 1: native status, dry-run and diagnostic gate"

[dependencies]
axum = "0.8.9"
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.29.0"
libc = "0.2"
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "lmloop"
path = "src/main.rs"
